<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>관제실 키보드 레이아웃 점검 (임시)</title>
<style>
  html, body { margin: 0; background: #F6F4EC; color: #241F12; font: 13px/1.4 -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", sans-serif; }
  #stage { width: 390px; margin: 0 auto; }
  #stage .lbl { font-weight: 700; padding: 6px 2px 4px; font-size: 12px; }
  #holder { width: 390px; height: 844px; }
  #holder iframe { display: block; width: 390px; height: 844px; border: 0; background: #fff; }
  #out { position: absolute; left: -9999px; top: 0; width: 700px; white-space: pre-wrap; }
</style>
</head>
<body>
<div id="stage">
  <div class="lbl" id="lbl">준비 중…</div>
  <div id="holder"></div>
</div>
<pre id="out">running…</pre>
<script>
/* 임시 점검 페이지 — 배포본 index.html 을 390x844 iframe(srcdoc)으로 띄우고,
   앱 스크립트가 실행되기 전에 innerHeight·visualViewport 목을 심어 iOS 키보드 상황을 재현합니다.
   초대 키·비밀값은 쓰지 않습니다. 점검이 끝나면 이 파일은 저장소에서 제거합니다. */
(function () {
  var holder = document.getElementById('holder');
  var out = document.getElementById('out');
  var lbl = document.getElementById('lbl');
  var CASE = (new RegExp('[?&]case=([\\w-]+)').exec(location.search) || [])[1] || 'all';
  var results = {};
  var HTML = '';

  // 앱 스크립트보다 먼저 도는 목 주입 스크립트 (innerHeight·visualViewport 둘 다)
  var MOCK = '<script>(function(){' +
    'var inn={h:844}, vv={h:844,t:0};' +
    'var fake={get height(){return vv.h},get offsetTop(){return vv.t},get width(){return 390},get scale(){return 1},' +
    'addEventListener:function(){},removeEventListener:function(){}};' +
    'Object.defineProperty(window,"innerHeight",{configurable:true,get:function(){return inn.h}});' +
    'Object.defineProperty(window,"visualViewport",{configurable:true,get:function(){return fake}});' +
    'window.__inn=inn;window.__vv=vv;' +
    '})();<\/script>';

  function wait(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }

  function showApp(w) {
    w.document.getElementById('lockScreen').hidden = true;
    w.document.body.classList.remove('is-locked');
    w.document.getElementById('appRoot').hidden = false;
    w.dispatchEvent(new w.Event('resize'));
  }

  function setState(w, inner, vvh, focused, keyboard) {
    var d = w.document;
    var old = d.getElementById('__kbmock');
    if (old) old.remove();
    w.__inn.h = inner;
    w.__vv.h = vvh;
    var i = d.getElementById('chatText');
    if (focused && i) i.focus();
    if (!focused && d.activeElement && d.activeElement.blur) d.activeElement.blur();
    w.dispatchEvent(new w.Event('resize'));
    if (keyboard && vvh < 700) {
      var k = d.createElement('div');
      k.id = '__kbmock';
      k.style.cssText = 'position:fixed;left:0;right:0;bottom:0;height:' + (844 - vvh) + 'px;background:#2B2B2F;z-index:99999;' +
        'color:#F2F2F2;font:600 13px/1 -apple-system,sans-serif;display:flex;align-items:flex-start;justify-content:center;padding-top:16px';
      k.textContent = '⌨️ 키보드 영역 (시뮬레이션 · 0~' + (844 - vvh) + 'px는 키보드, 앱은 ' + vvh + 'px까지)';
      d.body.appendChild(k);
    }
  }

  function read(w) {
    var d = w.document;
    var app = d.getElementById('appRoot');
    var form = d.getElementById('formChat');
    var dock = d.querySelector('.dock');
    var cs = w.getComputedStyle(app);
    return {
      kb: d.documentElement.classList.contains('is-kb'),
      padBottom: Math.round(parseFloat(cs.paddingBottom) || 0),
      appTop: Math.round(app.getBoundingClientRect().top),
      appHeight: Math.round(app.getBoundingClientRect().height),
      appBottom: Math.round(app.getBoundingClientRect().bottom),
      composerBottom: form ? Math.round(form.getBoundingClientRect().bottom) : null,
      dockDisplay: dock ? w.getComputedStyle(dock).display : null,
      scrollWidth: d.documentElement.scrollWidth,
      innerHeight: w.innerHeight,
      vvHeight: Math.round(w.visualViewport.height),
      jsErrors: d.documentElement.dataset.jsErrors || '',
      version: w.__PMR ? w.__PMR.version : null
    };
  }

  async function openFrame() {
    var f = document.createElement('iframe');
    f.title = '관제실 390x844 점검';
    holder.textContent = '';
    holder.appendChild(f);
    var loaded = new Promise(function (r) { f.addEventListener('load', r, { once: true }); });
    f.srcdoc = HTML;
    await loaded;
    var w = f.contentWindow;
    for (var n = 0; n < 60 && !(w.__PMR && w.__PMR.ready); n++) await wait(100);
    if (!w.__PMR) throw new Error('앱이 뜨지 않았습니다');
    showApp(w);
    await wait(350);
    return { f: f, w: w };
  }

  function closeFrame(f) { if (f && f.parentNode) f.remove(); }

  async function runCase(name, steps, keepOpen) {
    var o = await openFrame();
    var w = o.w, reads = [];
    for (var i = 0; i < steps.length; i++) {
      var s = steps[i];
      setState(w, s[0], s[1], s[2], s[3]);
      await wait(s[4] || 650);
      if (s[5]) reads.push(read(w));
    }
    if (!keepOpen) closeFrame(o.f);
    return { reads: reads, frame: o.f, w: o.w };
  }

  async function main() {
    var res = await fetch('index.html', { cache: 'no-store' });
    HTML = (await res.text()).replace('<head>', '<head>' + MOCK);
    if (HTML.indexOf('__inn') < 0) throw new Error('목 주입 실패');

    // 1) 일반 상태 (390x844 · 키보드 없음)
    var a = await runCase('normal', [[844, 844, false, false, 600, true]], CASE === 'normal');
    results.normal = a.reads[0];
    if (CASE !== 'normal') closeFrame(a.frame);

    // 2) iOS 홈화면 PWA 키보드 — innerHeight 와 visualViewport.height 가 함께 480 로 줄어듦
    var b = await runCase('kb_pwa', [
      [480, 480, true, false, 800, true],
      [844, 844, false, false, 700, true]    // 키보드 닫힘 복귀
    ], CASE === 'kb_pwa');
    results.kb_pwa = b.reads[0];
    results.kb_pwa_closed = b.reads[1];
    if (CASE !== 'kb_pwa') closeFrame(b.frame);

    // 3) iOS Safari 키보드 — innerHeight 는 844 그대로, visualViewport 만 480
    var c = await runCase('kb_safari', [[844, 480, true, false, 800, true]], CASE === 'kb_safari');
    results.kb_safari = c.reads[0];
    if (CASE !== 'kb_safari') closeFrame(c.frame);

    // 4) 가로 회전(390x390) — 키보드 아님으로 판정돼야 함
    var d = await runCase('landscape', [[390, 390, false, false, 700, true]], CASE === 'landscape');
    results.landscape = d.reads[0];
    if (CASE !== 'landscape') closeFrame(d.frame);

    // 캡처용 — 요청한 상태를 마지막에 새 프레임으로 다시 띄워 그대로 둡니다.
    var finalSteps = {
      normal: [[844, 844, false, false, 700, true]],
      kb_pwa: [[480, 480, true, true, 800, true]],
      kb_safari: [[844, 480, true, true, 800, true]],
      landscape: [[390, 390, false, false, 700, true]]
    }[CASE];
    if (finalSteps) {
      var fin = await runCase(CASE, finalSteps, true);
      results['final_' + CASE] = fin.reads[0];
      lbl.textContent = '화면 캡처: ' + CASE;
    }

    out.textContent = JSON.stringify(results, null, 2);
    window.__KBRESULT = results;
    if (CASE === 'all') lbl.textContent = '점검 완료 — __KBRESULT';
    window.__KBREADY = true;
  }

  main().catch(function (e) {
    out.textContent = 'ERR ' + (e && e.message ? e.message : e);
    window.__KBRESULT = { error: String(e && e.message ? e.message : e) };
    window.__KBREADY = true;
  });
})();
</script>
</body>
</html>
