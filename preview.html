<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>모바일 점검 · 피클 합동 회의실</title>
<style>
  html, body { margin: 0; background: #0d1624; color: #cfe0ff; font: 13px/1.5 system-ui, sans-serif; }
  body { display: grid; place-items: center; min-height: 100vh; }
  .wrap { display: grid; gap: 10px; justify-items: center; }
  .cap { font-weight: 700; letter-spacing: .04em; }
  iframe { width: 390px; height: 844px; border: 1px solid #2c3e5c; border-radius: 16px; background: #fff; }
</style>
</head>
<body>
<div class="wrap">
  <p class="cap">모바일 점검 전용 · 390 × 844 (iPhone 14급)</p>
  <iframe id="phone" title="피클 합동 회의실 모바일 점검" src="about:blank"></iframe>
</div>
<script>
  // 부모 주소의 ?room=...&key=... 를 그대로 앱에 넘깁니다(값은 이 파일에 저장하지 않음).
  document.getElementById('phone').src = 'index.html' + (location.search || '');
</script>
</body>
</html>
